<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>911 COMMAND</title><style>
*{box-sizing:border-box}body{margin:0;background:#09111d;color:#e9f3ff;font:14px system-ui;overflow:hidden}header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#152337;border-bottom:2px solid #da4141}header b{font-size:21px;letter-spacing:1px}main{height:calc(100dvh - 44px);display:grid;grid-template-columns:minmax(160px,22%) minmax(0,1fr) minmax(175px,23%)}aside{background:#112136;padding:10px;overflow:auto}h3{margin:4px 0 10px;color:#87c8ff;font-size:13px}.card{background:#1c3048;border:1px solid #395875;border-radius:8px;padding:9px;margin:7px 0}button{color:white;background:#274564;border:1px solid #557999;border-radius:6px;padding:9px;cursor:pointer;font-weight:650}button:active{background:#386c9d}.full{display:block;width:100%;margin:5px 0;text-align:left}.chosen{outline:2px solid #5fd6ff}.red{border-left:4px solid #f45a53}.green{background:#146a36;width:100%;font-size:17px}.muted{font-size:12px;color:#bbcadc}.map{position:relative;overflow:hidden;background:#0d1724;touch-action:none}.world{position:absolute;width:100%;height:100%;transform-origin:0 0;will-change:transform}.world img{display:block;width:100%;height:100%;user-select:none;pointer-events:none}.overlay{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;border:0;background:transparent;pointer-events:auto;padding:0}.hotspot.active{border:2px solid #ff4c46;border-radius:50%;box-shadow:0 0 13px #ff3e38;background:#ff4c4633;animation:pulse 1s infinite alternate}.hotspot.selected{outline:2px solid #6ed5ff}.hotspot span{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:#ba2e31;padding:2px 5px;border-radius:4px;white-space:nowrap;font-size:10px}@keyframes pulse{to{box-shadow:0 0 24px #ff3e38}}.vehicle{position:absolute;transform:translate(-50%,-50%);font-size:clamp(14px,2vw,25px);filter:drop-shadow(1px 2px 2px #000);transition:left 3s linear,top 3s linear}.tools{position:absolute;bottom:9px;right:9px;display:flex;gap:5px}.tools button{background:#142c47e8}.radio{font-size:12px;max-height:135px;overflow:auto;line-height:1.6}.row{display:flex;gap:5px}.row button{flex:1}@media(max-width:750px){header{height:36px}main{height:calc(100dvh - 36px);grid-template-columns:135px minmax(0,1fr) 150px}aside{padding:5px}button{padding:6px;font-size:11px}header b{font-size:15px}.card{padding:6px}.muted{font-size:10px}}
</style><style id="menu-style">#mainMenu{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(220px,34%) 1fr;background:#07111eea;color:#fff}#mainMenu.hidden{display:none}#mainMenu .menuSide{padding:clamp(12px,3vw,40px);background:linear-gradient(90deg,#08101cf5,#101d30ee);display:flex;flex-direction:column;justify-content:center;gap:9px;overflow:auto}#mainMenu h1{font-size:clamp(26px,5vw,65px);margin:0;line-height:1;color:#fff;text-shadow:2px 3px #b22b35}#mainMenu h2{margin:0 0 16px;font-size:clamp(13px,2vw,23px);color:#8ccfff;letter-spacing:3px}#mainMenu button{display:block;width:100%;text-align:center;font-size:clamp(13px,1.6vw,22px);padding:clamp(8px,1.5vh,17px);border:2px solid #388cc6;background:linear-gradient(#203f61,#0d243f);border-radius:9px}#mainMenu button.primary{background:linear-gradient(#14a53a,#07551e);border-color:#5dff87}#mainMenu button.danger{background:linear-gradient(#952e35,#4c111c);border-color:#ff6c6c}#mainMenu .menuCity{background:linear-gradient(90deg,#07111d 0%,transparent 18%),url('assets/cities/city_map.png') center/contain no-repeat,#08111d}#menuNotice{font-size:12px;color:#b7d2e7;min-height:20px}@media(max-width:700px){#mainMenu{grid-template-columns:40% 60%}#mainMenu .menuSide{padding:9px;gap:4px}#mainMenu h2{margin-bottom:4px}#mainMenu button{padding:5px}}</style></head><body><header><b>911 COMMAND</b><span id="time">DAY 1 • 08:00</span><span id="status">0 ACTIVE CALLS</span><span id="trafficVersion" style="font-size:10px;color:#9de9bd">TRAFFIC v0.9</span></header><main><aside><h3>INCOMING CALLS</h3><div id="calls"></div><button class="full" id="newcall">+ SIMULATE 911 CALL</button><h3>RADIO TRAFFIC</h3><div class="card radio" id="radio"></div></aside><section class="map" id="map"><div class="world" id="world"><img src="assets/cities/city_map.png" alt="Nine-block city map" id="city"><div class="overlay" id="overlay"></div></div><div class="tools"><button id="minus">−</button><button id="reset">FIT</button><button id="plus">+</button></div></section><aside><h3>DISPATCH UNITS</h3><div id="units"></div><div class="card red"><strong id="detail">Select an incident</strong><div class="muted" id="description">Select a call, choose a unit, then tap DISPATCH.</div></div><button class="green" id="dispatch">DISPATCH SELECTED</button><div class="row"><button id="pause">PAUSE</button><button id="speed">1×</button></div><p class="muted" id="report">Resolved: 0</p></aside></main><script>
'use strict';
const $=id=>document.getElementById(id),map=$('map'),world=$('world');
const locations=[['Police Station',.15,.73],['Fire Station',.15,.83],['EMS Center',.27,.83],['Bank',.41,.73],['City Hall',.50,.73],['Grocery Store',.41,.83],['Movie Theater',.59,.83],['School',.77,.73],['Hospital',.76,.83],['Library',.88,.83],['Church',.77,.93],['Residential North',.17,.16],['Residential Central',.50,.16],['Residential East',.82,.16],['Skyscrapers',.17,.49],['City Park',.50,.49],['Lake',.82,.49],['Gas Station',.50,.93]];
const units=[['P-12','Police','🚓',.15,.73],['P-14','Police','🚓',.15,.73],['P-18','Police','🚓',.15,.73],['F-1','Fire','🚒',.15,.83],['F-2','Fire','🚒',.15,.83],['M-1','EMS','🚑',.27,.83],['M-2','EMS','🚑',.27,.83],['S-1','SWAT','🚔',.15,.73],['D-1','Detective','🚙',.15,.73]].map(x=>({id:x[0],type:x[1],emoji:x[2],x:x[3],y:x[4],busy:false}));
const scenarios=[['Bank robbery','Police',[3]],['Structure fire','Fire',[11,12,13,14,17]],['Medical emergency','EMS',[7,8,10,11,12,13]],['Suspicious kidnapping','Police',[11,12,13,14]],['Armed standoff','SWAT',[11,12,13,14]],['Traffic collision','Police',[3,7,17]]];
let incidents=[],selectedUnit=0,selectedIncident=null,resolved=0,paused=false,speed=1,minute=480,zoom=1,tx=0,ty=0;
function log(s){$('radio').innerHTML='<div>• '+s+'</div>'+$('radio').innerHTML}
function render(){ $('units').innerHTML=units.map((u,i)=>'<button class="full '+(selectedUnit===i?'chosen':'')+'" data-unit="'+i+'">'+u.emoji+' '+u.id+' <span class="muted">'+u.type+' • '+(u.busy?'BUSY':'READY')+'</span></button>').join('');document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{selectedUnit=+b.dataset.unit;render()});$('calls').innerHTML=incidents.length?incidents.map(x=>'<button class="full '+(selectedIncident===x.id?'chosen':'')+'" data-call="'+x.id+'">🚨 '+x.title+'<div class="muted">'+locations[x.loc][0]+'</div></button>').join(''):'<p class="muted">No active incidents</p>';document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>selectIncident(+b.dataset.call));$('status').textContent=incidents.length+' ACTIVE CALLS';$('report').textContent='Resolved: '+resolved+' • Ready: '+units.filter(u=>!u.busy).length;renderMarkers()}
function renderMarkers(){ $('overlay').innerHTML=locations.map((l,i)=>{const inc=incidents.find(x=>x.loc===i);return '<button class="hotspot '+(inc?'active ':'')+(selectedIncident===inc?.id?'selected':'')+'" data-loc="'+i+'" title="'+l[0]+'" style="left:'+(l[1]*100-2)+'%;top:'+(l[2]*100-2)+'%;width:4%;height:4%">'+(inc?'<span>!</span>':'')+'</button>'}).join('')+units.map((u,i)=>'<div class="vehicle" id="v'+i+'" style="left:'+(u.x*100)+'%;top:'+(u.y*100)+'%">'+u.emoji+'</div>').join('');document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{const inc=incidents.find(x=>x.loc===+b.dataset.loc);if(inc)selectIncident(inc.id);else{ $('detail').textContent=locations[+b.dataset.loc][0];$('description').textContent='No active emergency at this location.'}})}
function selectIncident(id){const x=incidents.find(x=>x.id===id);if(!x)return;selectedIncident=id;$('detail').textContent=x.title;$('description').textContent=locations[x.loc][0]+' • Required response: '+x.need;render()}
function newCall(){if(paused||incidents.length>=6)return;const s=scenarios[Math.floor(Math.random()*scenarios.length)];const choices=s[2].filter(i=>!incidents.some(x=>x.loc===i));if(!choices.length)return;const loc=choices[Math.floor(Math.random()*choices.length)];const x={id:Date.now()+Math.floor(Math.random()*9999),title:s[0],need:s[1],loc};incidents.push(x);log('911: '+x.title+' at '+locations[loc][0]);selectIncident(x.id)}
function dispatch(){if(paused)return;const x=incidents.find(x=>x.id===selectedIncident),u=units[selectedUnit];if(!x){log('Select an active incident.');return}if(u.busy){log(u.id+' is busy.');return}u.busy=true;log(u.id+' responding to '+locations[x.loc][0]);const dest=locations[x.loc];u.x=dest[1];u.y=dest[2];render();setTimeout(()=>{log(u.id+' arrived on scene.');if(u.type===x.need){incidents=incidents.filter(a=>a.id!==x.id);resolved++;log('Scene secured: '+x.title);if(selectedIncident===x.id){selectedIncident=null;$('detail').textContent='Incident resolved';$('description').textContent='Select another active call.'}}else log('Wrong unit type; requesting '+x.need+'.');u.busy=false;render()},3000/speed)}
function apply(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+zoom+')'}
function setZoom(z,px=map.clientWidth/2,py=map.clientHeight/2){const nz=Math.max(1,Math.min(4,z));tx=px-(px-tx)*nz/zoom;ty=py-(py-ty)*nz/zoom;zoom=nz;clamp();apply()}
function clamp(){tx=Math.min(0,Math.max(map.clientWidth*(1-zoom),tx));ty=Math.min(0,Math.max(map.clientHeight*(1-zoom),ty))}
let pointers=new Map(),last=null;
map.addEventListener('pointerdown',e=>{if(e.target.closest('.tools'))return;map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){tx+=e.clientX-old.x;ty+=e.clientY-old.y;clamp();apply()}else if(pointers.size===2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(last)setZoom(zoom*dist/last,(p[0].x+p[1].x)/2-map.getBoundingClientRect().left,(p[0].y+p[1].y)/2-map.getBoundingClientRect().top);last=dist}});
function end(e){pointers.delete(e.pointerId);last=null}map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();setZoom(zoom*(e.deltaY<0?1.15:.87),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('plus').onclick=()=>setZoom(zoom*1.25);$('minus').onclick=()=>setZoom(zoom/1.25);$('reset').onclick=()=>{zoom=1;tx=ty=0;apply()};$('newcall').onclick=newCall;$('dispatch').onclick=dispatch;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent=speed+'×'};
setInterval(()=>{if(!paused){minute+=speed;$('time').textContent='DAY 1 • '+String(Math.floor(minute/60)%24).padStart(2,'0')+':'+String(minute%60).padStart(2,'0')}},1000);
$('city').onerror=()=>log('ERROR: city_map.png could not be loaded.');render();log('Dispatch online. City map loaded from assets/cities.');newCall();
</script><style id="traffic-style">.vehicle{transition:none!important;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--heading,0deg));font-size:clamp(11px,1.5vw,20px);z-index:5}.vehicle.civilian{opacity:.95}.patrol-btn{background:#27536a!important;border-color:#63b9d5!important}.vehicle img{width:100%;height:100%;object-fit:contain}.road-note{font-size:10px;color:#8cb6d1} .vehicle{width:2.7%;height:1.8%;display:flex;align-items:center;justify-content:center;transform-origin:center center}.vehicle img{display:block;image-rendering:auto}.vehicle .fallback{font-size:18px}.vehicle.civilian{width:3.3%;height:2.2%}.vehicle:not(.civilian){width:4%;height:2.7%}.vehicle{min-width:18px;min-height:12px;z-index:12;filter:drop-shadow(0 1px 2px #000)}</style>
<script id="traffic-engine">
/* 911 COMMAND traffic prototype: right-hand lanes on a configurable 4x4 road-node grid.
   Adjust road centers after measuring the underlying city image. */
// Road v2: calibrated against 3x3 city artwork. Four north/south and east/west arterials.
// Each painted street has TWO directions; arrows belong to lanes, not entire streets.
const roadX=[.045,.345,.655,.955],roadY=[.045,.345,.655,.955],lane=.011;
const rnd=n=>Math.floor(Math.random()*n),key=(a,b)=>a+','+b;
const fleetAssets={Police:'police/police_01.png',Fire:'fire/fire_01.png',EMS:'ambulance/ambulance_01.png',SWAT:'special/swat.png',Detective:'undercover/uc_01.png'};
const civilianAssets=['civilian/pickup_white.png','civilian/pickup_blue.png','civilian/pickup_red.png','civilian/suv_gray.png','civilian/suv_black.png','civilian/taxi_01.png','civilian/taxi_02.png','civilian/taxi_03.png','civilian/taxi_04.png'];
const spriteBase='assets/cars/';window.addEventListener('error',e=>{const label=document.getElementById('trafficVersion');if(label){label.textContent='TRAFFIC ERROR';label.style.color='#ff6a6a'}},false);
function spriteFor(d){if(d.civilian)return civilianAssets[(Number(d.unit.id.split('-')[1])-1)%civilianAssets.length];const u=d.unit;const number=(Number(u.id.replace(/[^0-9]/g,''))||1);if(u.type==='Police')return 'police/police_'+String((number-1)%4+1).padStart(2,'0')+'.png';if(u.type==='Fire')return 'fire/fire_'+String((number-1)%4+1).padStart(2,'0')+'.png';if(u.type==='EMS')return 'ambulance/ambulance_'+String((number-1)%4+1).padStart(2,'0')+'.png';return fleetAssets[u.type]||'civilian/suv_gray.png'}
function spriteElement(d){const img=document.createElement('img');img.src=spriteBase+spriteFor(d);img.alt=d.unit.type+' vehicle';img.loading='eager';img.decoding='async';img.draggable=false;img.onerror=()=>{img.style.display='none';if(!img.parentNode.querySelector('.fallback')){const span=document.createElement('span');span.className='fallback';span.textContent=d.unit.emoji;img.parentNode.appendChild(span)}};return img}
const traffic=[];
function node(a,b){return {a,b,x:roadX[a],y:roadY[b]}}
function nearest(x,y){let best=node(0,0),dist=Infinity;for(let a=0;a<4;a++)for(let b=0;b<4;b++){const n=node(a,b),v=(n.x-x)**2+(n.y-y)**2;if(v<dist){dist=v;best=n}}return best}
// Bidirectional carriageways: choose the right-hand lane for the actual direction of travel.
function route(start,end,emergency=false){const visited=new Set(),q=[[start]];while(q.length){const path=q.shift(),n=path[path.length-1];if(n.a===end.a&&n.b===end.b)return path;const k=key(n.a,n.b);if(visited.has(k))continue;visited.add(k);for(const [da,db] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=n.a+da,b=n.b+db;if(a>=0&&a<4&&b>=0&&b<4&&!visited.has(key(a,b)))q.push([...path,node(a,b)])}}return [start]}
function lanePoint(from,to,t){const dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy)||1;return {x:from.x+dx*t-dy/len*lane,y:from.y+dy*t+dx/len*lane,angle:Math.atan2(dy,dx)*180/Math.PI}}
function smoothPoint(path,i,t){const from=path[i],to=path[i+1],p=lanePoint(from,to,t);if(i>0&&t<.12){const prev=lanePoint(path[i-1],from,1),s=t/.12,k=s*s*(3-2*s);p.x=prev.x*(1-k)+p.x*k;p.y=prev.y*(1-k)+p.y*k;p.angle=prev.angle+(p.angle-prev.angle)*k}if(i+2<path.length&&t>.88){const next=lanePoint(to,path[i+2],0),s=(t-.88)/.12,k=s*s*(3-2*s);p.x=p.x*(1-k)+next.x*k;p.y=p.y*(1-k)+next.y*k;p.angle=p.angle+(next.angle-p.angle)*k}return p}
function makeDriver(u,civilian=false){const start=nearest(u.x,u.y);return {unit:u,civilian,at:start,path:[],index:0,progress:0,x:start.x,y:start.y,angle:0,mode:civilian?'traffic':'station',speed:civilian?.033+Math.random()*.009:.055,incident:null,wait:0}}
units.forEach(u=>{u.driver=makeDriver(u)});
const civilianColors=Array.from({length:16},(_,i)=>['🚗','🚙','🚕','🚘'][i%4]);
civilianColors.forEach((emoji,i)=>{const n=node(rnd(4),rnd(4));const d=makeDriver({id:'C-'+(i+1),type:'Civilian',emoji,x:n.x,y:n.y,busy:false},true);d.progress=0;d.wait=i*.28;traffic.push(d)});
function travel(d,target,mode){const start=nearest(d.x,d.y);d.at=start;d.path=route(start,target,mode==='respond');d.index=0;d.progress=0;d.mode=mode;d.wait=0}
function randomDestination(d){let target=node(rnd(4),rnd(4));while(target.a===d.at.a&&target.b===d.at.b)target=node(rnd(4),rnd(4));travel(d,target,d.civilian?'traffic':'patrol')}
traffic.forEach(randomDestination);
// Intersection reservations prevent simultaneous entry. Civilian exits are recycled to fresh perimeter entrances.
const intersectionReservations=new Map();
function segmentAngle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}
function priority(d){return d.mode==='respond'?0:d.mode==='return'?1:d.civilian?3:2}
function recycleCivilian(d){const side=rnd(4),k=rnd(4);const n=side===0?node(k,0):side===1?node(k,3):side===2?node(0,k):node(3,k);d.at=n;d.x=n.x;d.y=n.y;d.path=[];d.index=0;d.progress=0;d.wait=1+Math.random()*3;randomDestination(d)}
function arrive(d){if(d.mode==='respond'){d.mode='scene';d.wait=3;const inc=d.incident;if(inc){log(d.unit.id+' ARRIVED at '+locations[inc.loc][0]);if(inc.need==='EMS'||inc.need===d.unit.type||(inc.need==='Police'&&['SWAT','Detective'].includes(d.unit.type))){if(inc.need==='EMS'||inc.need===d.unit.type){if(incidents.some(x=>x.id===inc.id)){incidents=incidents.filter(x=>x.id!==inc.id);resolved++;log('Help arrived: '+inc.title);if(selectedIncident===inc.id)selectedIncident=null}}}render()}return}
if(d.mode==='return'){d.mode='station';d.x=d.unit.x;d.y=d.unit.y;d.unit.busy=false;d.path=[];render();return}
if(d.civilian&&Math.random()<.38){recycleCivilian(d);return}
d.at=d.path[d.path.length-1]||d.at;randomDestination(d);d.wait=.3+Math.random()*.8}
function moveDriver(d,dt){
if(d.mode==='station')return;
if(d.mode==='scene'){d.wait-=dt;if(d.wait<=0){travel(d,nearest(d.unit.x,d.unit.y),'return');log(d.unit.id+' returning to station')}return}
if(d.wait>0){d.wait-=dt;return}
if(!d.path.length||d.index>=d.path.length-1){arrive(d);return}
const from=d.path[d.index],to=d.path[d.index+1],length=Math.hypot(to.x-from.x,to.y-from.y);
const others=[...traffic,...units.map(u=>u.driver)];
let factor=1;
const approaching=d.progress>.76;
const crossKey=key(to.a,to.b);
if(approaching){
const holder=intersectionReservations.get(crossKey);
if(holder&&holder!==d&&holder.index<holder.path.length-1){factor=0}
else if(!holder)intersectionReservations.set(crossKey,d);
if(d.index+2<d.path.length){const next=d.path[d.index+2];if((to.a-from.a)!==(next.a-to.a)||(to.b-from.b)!==(next.b-to.b))factor=Math.min(factor,.50)}
}
if(d.mode!=='respond'){
const p=smoothPoint(d.path,d.index,d.progress);
for(const o of others){if(o===d||o.mode==='station'||o.mode==='scene')continue;
const dist=Math.hypot(o.x-p.x,o.y-p.y);
const sameHeading=Math.abs(((o.angle-d.angle+540)%360)-180)<32;
if(sameHeading&&dist<.032){const dx=Math.cos(d.angle*Math.PI/180),dy=Math.sin(d.angle*Math.PI/180),ahead=(o.x-p.x)*dx+(o.y-p.y)*dy;if(ahead>0&&ahead<.042){factor=0;break}}
}
}
d.progress+=dt*d.speed*speed*factor/Math.max(length,.001);
if(d.progress>=1){d.at=to;d.index++;d.progress=0;intersectionReservations.delete(key(to.a,to.b));if(d.index>=d.path.length-1){arrive(d);return}}
const p=smoothPoint(d.path,d.index,d.progress);d.x=p.x;d.y=p.y;d.angle=p.angle;
}
const oldRenderMarkers=renderMarkers;
renderMarkers=function(){oldRenderMarkers();const overlay=$('overlay');overlay.querySelectorAll('.vehicle').forEach(e=>e.remove());[...units.map(u=>u.driver),...traffic].forEach((d,i)=>{const el=document.createElement('div');el.className='vehicle'+(d.civilian?' civilian':'');el.id='driver-'+i;el.appendChild(spriteElement(d));el.title=d.unit.id+' • '+d.mode;overlay.appendChild(el);d.el=el});positionVehicles()};
function positionVehicles(){for(const d of [...units.map(u=>u.driver),...traffic])if(d.el){d.el.style.left=(d.x*100)+'%';d.el.style.top=(d.y*100)+'%';d.el.style.setProperty('--heading',(d.angle+180)+'deg')}}
const oldRender=render;render=function(){oldRender();document.querySelectorAll('[data-unit]').forEach(b=>{const i=+b.dataset.unit,d=units[i].driver;b.querySelector('.muted').textContent=units[i].type+' • '+(d.mode==='patrol'?'PATROLLING':d.mode==='respond'?'RESPONDING':d.mode==='scene'?'ON SCENE':'AT STATION')})};
dispatch=function(){if(paused)return;const x=incidents.find(x=>x.id===selectedIncident),u=units[selectedUnit];if(!x){log('Select an active incident.');return}if(u.driver.mode==='respond'||u.driver.mode==='scene'||u.driver.mode==='return'){log(u.id+' is unavailable.');return}u.busy=true;u.driver.incident=x;travel(u.driver,nearest(locations[x.loc][1],locations[x.loc][2]),'respond');log(u.id+' dispatched by road to '+locations[x.loc][0]);render()};
$('dispatch').onclick=dispatch;
const patrol=document.createElement('button');patrol.className='full patrol-btn';patrol.id='patrol';patrol.textContent='START / STOP PATROL';$('dispatch').insertAdjacentElement('afterend',patrol);
patrol.onclick=()=>{const u=units[selectedUnit],d=u.driver;if(['respond','scene','return'].includes(d.mode)){log(u.id+' is on an assignment and cannot patrol.');return}if(d.mode==='patrol'){travel(d,nearest(u.x,u.y),'return');log(u.id+' returning to station.')}else{randomDestination(d);log(u.id+' starting city patrol.')}render()};
let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;const menu=document.getElementById('mainMenu');if(!paused&&(!menu||menu.classList.contains('hidden')))for(const d of [...units.map(u=>u.driver),...traffic])moveDriver(d,dt);positionVehicles();requestAnimationFrame(frame)}requestAnimationFrame(frame);
render();document.getElementById('trafficVersion').textContent='TRAFFIC v0.9 • '+traffic.length+' PNG CARS';log('Traffic routing: normal traffic obeys directional streets; emergency response can use restricted directions. '+traffic.length+' civilian PNG cars. Emergency units at stations.');
</script><style id="call-ui-style">

<script id="call-engine">
(function(){
const aside=document.querySelector('main > aside');
if(!aside)return;
const panel=document.createElement('div');panel.id='callPanel';
panel.innerHTML='<button id="callPhone" type="button"><span class="phoneSymbol">☎</span><span id="callStatus">WAITING FOR CALL</span><span id="callAction">—</span></button><div id="callTranscript" aria-live="polite"></div><div id="callQuestions"></div><div id="callAddress"></div>';
aside.insertBefore(panel,aside.firstChild);
const phone=document.getElementById('callPhone'),status=document.getElementById('callStatus'),action=document.getElementById('callAction'),transcript=document.getElementById('callTranscript'),questions=document.getElementById('callQuestions'),address=document.getElementById('callAddress');
const templates=[
{title:'Medical emergency',need:'EMS',locs:[7,8,10,11,12,13],opening:'Please help! Someone collapsed and needs help!',details:'They are breathing, but they are barely responding.',hazard:'No fire or weapons. Please send someone quickly.'},
{title:'Structure fire',need:'Fire',locs:[11,12,13,14,17],opening:'There is smoke coming from a building!',details:'I can see flames near the windows.',hazard:'People might still be inside.'},
{title:'Bank robbery',need:'Police',locs:[3],opening:'Someone is robbing the bank!',details:'The suspect is still here and people are scared.',hazard:'I think the suspect may have a weapon.'},
{title:'Traffic collision',need:'Police',locs:[3,7,17],opening:'Two vehicles just crashed!',details:'One driver looks hurt and needs medical help.',hazard:'The vehicles are blocking the street.'},
{title:'Armed standoff',need:'SWAT',locs:[11,12,13,14],opening:'There is an armed person threatening people!',details:'They are inside the building.',hazard:'I saw a weapon. Please be careful.'}
];
let active=null,answered=false,ringTimer=null,callNumber=0;
function bubble(who,message){const el=document.createElement('div');el.className='callBubble'+(who==='operator'?' operator':'');el.textContent=(who==='operator'?'YOU: ':'CALLER: ')+message;transcript.appendChild(el);transcript.scrollTop=transcript.scrollHeight}
function ring(){if(active||paused)return;const t=templates[Math.floor(Math.random()*templates.length)];const loc=t.locs[Math.floor(Math.random()*t.locs.length)];active={...t,loc,asked:new Set(),revealed:false,id:++callNumber};answered=false;phone.className='ringing';status.textContent='INCOMING 911 CALL';action.textContent='ANSWER';transcript.innerHTML='';questions.innerHTML='';address.textContent='';if(navigator.vibrate)navigator.vibrate([160,100,160]);log('Incoming 911 call. Answer the phone.')}
function ask(k,label,reply){if(!active||!answered||active.asked.has(k))return;active.asked.add(k);bubble('operator',label);bubble('caller',reply);if(k==='address'){active.revealed=true;address.textContent='DISPATCH ADDRESS: '+locations[active.loc][0];const inc={id:Date.now()+active.id,title:active.title,need:active.need,loc:active.loc};incidents.push(inc);selectIncident(inc.id);log('Address confirmed: '+locations[active.loc][0]+'. Select a responding unit.')}showQuestions()}
function showQuestions(){questions.innerHTML='';if(!active||!answered)return;const opts=[['where','What is the address or location?', 'I am at '+locations[active.loc][0]+'.'],['what','Tell me exactly what happened.',active.details],['danger','Is anyone in immediate danger?',active.hazard],['injury','Is anyone injured or having trouble breathing?',active.need==='EMS'?'Yes, they need medical attention.':active.title==='Traffic collision'?'One person may be injured.':'I am not sure. Please send help.']];for(const [k,q,r] of opts){if(active.asked.has(k))continue;const btn=document.createElement('button');btn.type='button';btn.textContent=q;btn.onclick=()=>ask(k==='where'?'address':k,q,r);questions.appendChild(btn)}}
phone.onclick=()=>{if(!active){ring();return}if(answered)return;answered=true;phone.className='answered';status.textContent='CALL CONNECTED';action.textContent='LIVE';bubble('operator','911, what is your emergency?');bubble('caller',active.opening);showQuestions()};
const originalNewCall=newCall;
newCall=function(){if(active){log('Finish the current call before taking another.');return}ring()};
document.getElementById('newcall').onclick=newCall;
const oldDispatch=dispatch;
dispatch=function(){if(active&&!active.revealed){log('Ask the caller for the address before dispatching.');return}const inc=incidents.find(x=>x.id===selectedIncident);if(!inc){log('Answer a call and confirm its address first.');return}oldDispatch();if(active&&active.revealed&&inc.loc===active.loc){bubble('operator','Help is on the way. Stay somewhere safe.');status.textContent='CALL COMPLETED';action.textContent='✓';active=null;answered=false;questions.innerHTML='';clearTimeout(ringTimer);ringTimer=setTimeout(()=>{phone.className='';status.textContent='WAITING FOR CALL';action.textContent='—';ring()},12000)}};
document.getElementById('dispatch').onclick=dispatch;
incidents=[];selectedIncident=null;render();ring();
})();
</script><div id="mainMenu"><div class="menuSide"><h1>911 COMMAND</h1><h2>CITY DISPATCH</h2><button class="primary" id="menuPlay">▶ PLAY GAME</button><button id="menuCampaign">CAMPAIGN</button><button id="menuOptions">OPTIONS</button><button id="menuCredits">CREDITS</button><button class="danger" id="menuExit">EXIT</button><div id="menuNotice">Emergency Dispatch • Prototype v0.3</div></div><div class="menuCity" role="img" aria-label="Nine-block city map"></div></div><script>document.getElementById('menuPlay').onclick=()=>document.getElementById('mainMenu').classList.add('hidden');document.getElementById('menuCampaign').onclick=()=>document.getElementById('menuNotice').textContent='Campaign mode is planned for a future update.';document.getElementById('menuOptions').onclick=()=>document.getElementById('menuNotice').textContent='Map zoom and simulation speed are available during gameplay.';document.getElementById('menuCredits').onclick=()=>document.getElementById('menuNotice').textContent='911 COMMAND • MJC game project';document.getElementById('menuExit').onclick=()=>{document.getElementById('menuNotice').textContent='Use Android Back or close the app to exit.'};document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')document.getElementById('mainMenu').classList.remove('hidden')});</script></body></html>
