<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>911 COMMAND</title><style>
*{box-sizing:border-box}body{margin:0;background:#09111d;color:#e9f3ff;font:14px system-ui;overflow:hidden}header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#152337;border-bottom:2px solid #da4141}header b{font-size:21px;letter-spacing:1px}main{height:calc(100dvh - 44px);display:grid;grid-template-columns:minmax(160px,22%) minmax(0,1fr) minmax(175px,23%)}aside{background:#112136;padding:10px;overflow:auto}h3{margin:4px 0 10px;color:#87c8ff;font-size:13px}.card{background:#1c3048;border:1px solid #395875;border-radius:8px;padding:9px;margin:7px 0}button{color:white;background:#274564;border:1px solid #557999;border-radius:6px;padding:9px;cursor:pointer;font-weight:650}button:active{background:#386c9d}.full{display:block;width:100%;margin:5px 0;text-align:left}.chosen{outline:2px solid #5fd6ff}.red{border-left:4px solid #f45a53}.green{background:#146a36;width:100%;font-size:17px}.muted{font-size:12px;color:#bbcadc}.map{position:relative;overflow:hidden;background:#0d1724;touch-action:none}.world{position:absolute;width:100%;height:100%;transform-origin:0 0;will-change:transform}.world img{display:block;width:100%;height:100%;user-select:none;pointer-events:none}.overlay{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;border:0;background:transparent;pointer-events:auto;padding:0}.hotspot.active{border:2px solid #ff4c46;border-radius:50%;box-shadow:0 0 13px #ff3e38;background:#ff4c4633;animation:pulse 1s infinite alternate}.hotspot.selected{outline:2px solid #6ed5ff}.hotspot span{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:#ba2e31;padding:2px 5px;border-radius:4px;white-space:nowrap;font-size:10px}@keyframes pulse{to{box-shadow:0 0 24px #ff3e38}}.vehicle{position:absolute;transform:translate(-50%,-50%);font-size:clamp(14px,2vw,25px);filter:drop-shadow(1px 2px 2px #000);transition:left 3s linear,top 3s linear}.tools{position:absolute;bottom:9px;right:9px;display:flex;gap:5px}.tools button{background:#142c47e8}.radio{font-size:12px;max-height:135px;overflow:auto;line-height:1.6}.row{display:flex;gap:5px}.row button{flex:1}@media(max-width:750px){header{height:36px}main{height:calc(100dvh - 36px);grid-template-columns:135px minmax(0,1fr) 150px}aside{padding:5px}button{padding:6px;font-size:11px}header b{font-size:15px}.card{padding:6px}.muted{font-size:10px}}
</style><style id="menu-style">#mainMenu{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(220px,34%) 1fr;background:#07111eea;color:#fff}#mainMenu.hidden{display:none}#mainMenu .menuSide{padding:clamp(12px,3vw,40px);background:linear-gradient(90deg,#08101cf5,#101d30ee);display:flex;flex-direction:column;justify-content:center;gap:9px;overflow:auto}#mainMenu h1{font-size:clamp(26px,5vw,65px);margin:0;line-height:1;color:#fff;text-shadow:2px 3px #b22b35}#mainMenu h2{margin:0 0 16px;font-size:clamp(13px,2vw,23px);color:#8ccfff;letter-spacing:3px}#mainMenu button{display:block;width:100%;text-align:center;font-size:clamp(13px,1.6vw,22px);padding:clamp(8px,1.5vh,17px);border:2px solid #388cc6;background:linear-gradient(#203f61,#0d243f);border-radius:9px}#mainMenu button.primary{background:linear-gradient(#14a53a,#07551e);border-color:#5dff87}#mainMenu button.danger{background:linear-gradient(#952e35,#4c111c);border-color:#ff6c6c}#mainMenu .menuCity{background:linear-gradient(90deg,#07111d 0%,transparent 18%),url('assets/cities/city_map.png') center/contain no-repeat,#08111d}#menuNotice{font-size:12px;color:#b7d2e7;min-height:20px}@media(max-width:700px){#mainMenu{grid-template-columns:40% 60%}#mainMenu .menuSide{padding:9px;gap:4px}#mainMenu h2{margin-bottom:4px}#mainMenu button{padding:5px}}</style></head><body><header><b>911 COMMAND</b><span id="time">DAY 1 • 08:00</span><span id="status">0 ACTIVE CALLS</span></header><main><aside><h3>INCOMING CALLS</h3><div id="calls"></div><button class="full" id="newcall">+ SIMULATE 911 CALL</button><h3>RADIO TRAFFIC</h3><div class="card radio" id="radio"></div></aside><section class="map" id="map"><div class="world" id="world"><img src="assets/cities/city_map.png" alt="Nine-block city map" id="city"><div class="overlay" id="overlay"></div></div><div class="tools"><button id="minus">−</button><button id="reset">FIT</button><button id="plus">+</button></div></section><aside><h3>DISPATCH UNITS</h3><div id="units"></div><div class="card red"><strong id="detail">Select an incident</strong><div class="muted" id="description">Select a call, choose a unit, then tap DISPATCH.</div></div><button class="green" id="dispatch">DISPATCH SELECTED</button><div class="row"><button id="pause">PAUSE</button><button id="speed">1×</button></div><p class="muted" id="report">Resolved: 0</p></aside></main><script>
'use strict';
const $=id=>document.getElementById(id),map=$('map'),world=$('world');
const locations=[['Police Station',.15,.73],['Fire Station',.15,.83],['EMS Center',.27,.83],['Bank',.41,.73],['City Hall',.50,.73],['Grocery Store',.41,.83],['Movie Theater',.59,.83],['School',.77,.73],['Hospital',.76,.83],['Library',.88,.83],['Church',.77,.93],['Residential North',.17,.16],['Residential Central',.50,.16],['Residential East',.82,.16],['Skyscrapers',.17,.49],['City Park',.50,.49],['Lake',.82,.49],['Gas Station',.50,.93]];
const units=[['P-12','Police','🚓',.15,.73],['P-14','Police','🚓',.15,.73],['P-18','Police','🚓',.15,.73],['F-1','Fire','🚒',.15,.83],['F-2','Fire','🚒',.15,.83],['M-1','EMS','🚑',.27,.83],['M-2','EMS','🚑',.27,.83],['S-1','SWAT','🚔',.15,.73],['D-1','Detective','🚙',.15,.73]].map(x=>({id:x[0],type:x[1],emoji:x[2],x:x[3],y:x[4],busy:false}));
const scenarios=[['Bank robbery','Police',[3]],['Structure fire','Fire',[11,12,13,14,17]],['Medical emergency','EMS',[7,8,10,11,12,13]],['Suspicious kidnapping','Police',[11,12,13,14]],['Armed standoff','SWAT',[11,12,13,14]],['Traffic collision','Police',[3,7,17]]];
let incidents=[],selectedUnit=0,selectedIncident=null,resolved=0,paused=false,speed=1,minute=480,zoom=1,tx=0,ty=0;
function log(s){$('radio').innerHTML='<div>• '+s+'</div>'+$('radio').innerHTML}
function render(){ $('units').innerHTML=units.map((u,i)=>'<button class="full '+(selectedUnit===i?'chosen':'')+'" data-unit="'+i+'">'+u.emoji+' '+u.id+' <span class="muted">'+u.type+' • '+(u.busy?'BUSY':'READY')+'</span></button>').join('');document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{selectedUnit=+b.dataset.unit;render()});$('calls').innerHTML=incidents.length?incidents.map(x=>'<button class="full '+(selectedIncident===x.id?'chosen':'')+'" data-call="'+x.id+'">🚨 '+x.title+'<div class="muted">'+locations[x.loc][0]+'</div></button>').join(''):'<p class="muted">No active incidents</p>';document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>selectIncident(+b.dataset.call));$('status').textContent=incidents.length+' ACTIVE CALLS';$('report').textContent='Resolved: '+resolved+' • Ready: '+units.filter(u=>!u.busy).length;renderMarkers()}
function renderMarkers(){ $('overlay').innerHTML=locations.map((l,i)=>{const inc=incidents.find(x=>x.loc===i);return '<button class="hotspot '+(inc?'active ':'')+(selectedIncident===inc?.id?'selected':'')+'" data-loc="'+i+'" title="'+l[0]+'" style="left:'+(l[1]*100-2)+'%;top:'+(l[2]*100-2)+'%;width:4%;height:4%">'+(inc?'<span>!</span>':'')+'</button>'}).join('')+units.map((u,i)=>'<div class="vehicle" id="v'+i+'" style="left:'+(u.x*100)+'%;top:'+(u.y*100)+'%">'+u.emoji+'</div>').join('');document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{const inc=incidents.find(x=>x.loc===+b.dataset.loc);if(inc)selectIncident(inc.id);else{ $('detail').textContent=locations[+b.dataset.loc][0];$('description').textContent='No active emergency at this location.'}})}
function selectIncident(id){const x=incidents.find(x=>x.id===id);if(!x)return;selectedIncident=id;$('detail').textContent=x.title;$('description').textContent=locations[x.loc][0]+' • Required response: '+x.need;render()}
function newCall(){if(paused||incidents.length>=6)return;const s=scenarios[Math.floor(Math.random()*scenarios.length)];const choices=s[2].filter(i=>!incidents.some(x=>x.loc===i));if(!choices.length)return;const loc=choices[Math.floor(Math.random()*choices.length)];const x={id:Date.now()+Math.floor(Math.random()*9999),title:s[0],need:s[1],loc};incidents.push(x);log('911: '+x.title+' at '+locations[loc][0]);selectIncident(x.id)}
function dispatch(){if(paused)return;const x=incidents.find(x=>x.id===selectedIncident),u=units[selectedUnit];if(!x){log('Select an active incident.');return}if(u.busy){log(u.id+' is busy.');return}u.busy=true;log(u.id+' responding to '+locations[x.loc][0]);const dest=locations[x.loc];u.x=dest[1];u.y=dest[2];render();setTimeout(()=>{log(u.id+' arrived on scene.');if(u.type===x.need){incidents=incidents.filter(a=>a.id!==x.id);resolved++;log('Scene secured: '+x.title);if(selectedIncident===x.id){selectedIncident=null;$('detail').textContent='Incident resolved';$('description').textContent='Select another active call.'}}else log('Wrong unit type; requesting '+x.need+'.');u.busy=false;render()},3000/speed)}
function apply(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+zoom+')'}
function setZoom(z,px=map.clientWidth/2,py=map.clientHeight/2){const nz=Math.max(1,Math.min(4,z));tx=px-(px-tx)*nz/zoom;ty=py-(py-ty)*nz/zoom;zoom=nz;clamp();apply()}
function clamp(){tx=Math.min(0,Math.max(map.clientWidth*(1-zoom),tx));ty=Math.min(0,Math.max(map.clientHeight*(1-zoom),ty))}
let pointers=new Map(),last=null;
map.addEventListener('pointerdown',e=>{if(e.target.closest('.tools'))return;map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){tx+=e.clientX-old.x;ty+=e.clientY-old.y;clamp();apply()}else if(pointers.size===2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(last)setZoom(zoom*dist/last,(p[0].x+p[1].x)/2-map.getBoundingClientRect().left,(p[0].y+p[1].y)/2-map.getBoundingClientRect().top);last=dist}});
function end(e){pointers.delete(e.pointerId);last=null}map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();setZoom(zoom*(e.deltaY<0?1.15:.87),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('plus').onclick=()=>setZoom(zoom*1.25);$('minus').onclick=()=>setZoom(zoom/1.25);$('reset').onclick=()=>{zoom=1;tx=ty=0;apply()};$('newcall').onclick=newCall;$('dispatch').onclick=dispatch;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent=speed+'×'};
setInterval(()=>{if(!paused){minute+=speed;$('time').textContent='DAY 1 • '+String(Math.floor(minute/60)%24).padStart(2,'0')+':'+String(minute%60).padStart(2,'0')}},1000);
$('city').onerror=()=>log('ERROR: city_map.png could not be loaded.');render();log('Dispatch online. City map loaded from assets/cities.');newCall();
</script><div id="mainMenu"><div class="menuSide"><h1>911 COMMAND</h1><h2>CITY DISPATCH</h2><button class="primary" id="menuPlay">▶ PLAY GAME</button><button id="menuCampaign">CAMPAIGN</button><button id="menuOptions">OPTIONS</button><button id="menuCredits">CREDITS</button><button class="danger" id="menuExit">EXIT</button><div id="menuNotice">Emergency Dispatch • Prototype v0.3</div></div><div class="menuCity" role="img" aria-label="Nine-block city map"></div></div><script>document.getElementById('menuPlay').onclick=()=>document.getElementById('mainMenu').classList.add('hidden');document.getElementById('menuCampaign').onclick=()=>document.getElementById('menuNotice').textContent='Campaign mode is planned for a future update.';document.getElementById('menuOptions').onclick=()=>document.getElementById('menuNotice').textContent='Map zoom and simulation speed are available during gameplay.';document.getElementById('menuCredits').onclick=()=>document.getElementById('menuNotice').textContent='911 COMMAND • MJC game project';document.getElementById('menuExit').onclick=()=>{document.getElementById('menuNotice').textContent='Use Android Back or close the app to exit.'};document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')document.getElementById('mainMenu').classList.remove('hidden')});</script></body></html>
