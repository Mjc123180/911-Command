<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>911 COMMAND</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a111c;color:#e6edf5;font:14px system-ui;overflow:hidden}header{height:46px;background:#111e2e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid #d23c3c}header strong{font-size:20px;letter-spacing:2px}main{display:grid;grid-template-columns:210px 1fr 280px;height:calc(100dvh - 46px)}aside{background:#152233;padding:12px;overflow:auto}h3{font-size:13px;letter-spacing:1px;color:#93b3d5;margin:8px 0 12px}button{cursor:pointer;background:#253a50;color:white;border:1px solid #47627c;border-radius:6px;padding:9px;margin:3px 0;font-weight:600}button:active{background:#38668e}.unit{width:100%;text-align:left;display:block}.unit.selected{border-color:#59c5ff;background:#214b70}.unit small{display:block;color:#afc2d7}.map{position:relative;overflow:hidden;background:#263d42;touch-action:manipulation}.city{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;padding:20px;background:linear-gradient(90deg,transparent 49%,#4e5660 49%,#4e5660 51%,transparent 51%),linear-gradient(transparent 48%,#4e5660 48%,#4e5660 52%,transparent 52%)}.block{border:6px solid #71816f;background:#4c6759;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;min-height:0}.building{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;background:#697e89;border:3px solid #a0aeb3;box-shadow:5px 5px 0 #243b43;font-size:clamp(9px,1vw,13px);font-weight:700;color:white;padding:4px}.building.incident{background:#933e39;border-color:#ffae71;animation:pulse 1.2s infinite}.building.done{background:#356d56;border-color:#81e2a5}@keyframes pulse{50%{filter:brightness(1.4)}}.marker{position:absolute;right:-5px;top:-12px;background:#f43d3d;padding:3px 6px;border-radius:12px}.vehicles{position:absolute;inset:0;pointer-events:none}.vehicle{position:absolute;font-size:22px;transition:left 2.5s linear,top 2.5s linear;filter:drop-shadow(2px 2px 2px black)}.vehicle.moving{animation:flash .5s infinite alternate}@keyframes flash{to{filter:drop-shadow(0 0 8px #4cc4ff)}}.panel{background:#203146;border-radius:8px;padding:12px;margin-bottom:12px}.alert{border-left:4px solid #f35d56}.radio{font-size:12px;line-height:1.6;max-height:120px;overflow:auto}.status{color:#9fd8fa}.controls{display:flex;gap:6px}.controls button{flex:1}.hint{color:#b8cad8;font-size:12px}@media(max-width:800px){main{grid-template-columns:145px 1fr 195px}aside{padding:6px}.panel{padding:7px}.building{font-size:9px}.block{padding:5px;gap:4px}.city{padding:8px;gap:12px}header{height:38px}main{height:calc(100dvh - 38px)}} </style></head><body><header><strong>911 COMMAND</strong><span id="clock">DAY 1 • 08:00</span><span id="count">ACTIVE INCIDENTS: 0</span></header><main><aside><h3>AVAILABLE UNITS</h3><div id="units"></div><p class="hint">Select a unit, then tap a red incident building to dispatch.</p></aside><section class="map"><div class="city" id="city"></div><div class="vehicles" id="vehicles"></div></section><aside><h3>DISPATCH CONSOLE</h3><div class="panel alert"><strong id="incidentTitle">Awaiting emergency calls</strong><p id="incidentDesc" class="hint">Tap NEW CALL to generate an incident.</p><div class="controls"><button id="call">NEW CALL</button><button id="pause">PAUSE</button></div></div><div class="panel"><h3>RADIO TRAFFIC</h3><div id="radio" class="radio"></div></div><div class="panel"><h3>SHIFT REPORT</h3><div id="score">Resolved: 0<br>Units available: 9</div></div></aside></main><script>
const roster=[['P-12','Police','🚓'],['P-14','Police','🚓'],['P-18','Police','🚓'],['F-1','Fire','🚒'],['F-2','Fire','🚒'],['M-1','EMS','🚑'],['M-2','EMS','🚑'],['S-1','SWAT','🚔'],['D-1','Detective','🚙']];
const districts=[['DOWNTOWN','Bank','Office','Shops','Hotel','Courthouse','Restaurant'],['RESIDENTIAL','School','Church','Houses','Apartments','Park','Clinic'],['CIVIC','Police HQ','Fire Station','Hospital','Library','City Hall','Market'],['INDUSTRIAL','Warehouse','Factory','Gas Station','Depot','Garage','Storage']];
const types=[{title:'Bank robbery',need:'Police',where:['Bank']},{title:'Structure fire',need:'Fire',where:['Warehouse','Factory','Apartments','Hotel','School']},{title:'Medical emergency',need:'EMS',where:['School','Church','Market','Houses']},{title:'Suspicious kidnapping',need:'Police',where:['Hotel','Park','Apartments']},{title:'Industrial explosion',need:'Fire',where:['Factory','Warehouse']},{title:'Armed barricade',need:'SWAT',where:['Houses','Hotel']}];
let selected=0,incidents=[],resolved=0,paused=false,minute=480;
const el=id=>document.getElementById(id),log=s=>{el('radio').innerHTML='<div>• '+s+'</div>'+el('radio').innerHTML};
function renderUnits(){el('units').innerHTML=roster.map((u,i)=>'<button class="unit '+(selected===i?'selected':'')+'" data-i="'+i+'">'+u[2]+' '+u[0]+' <small>'+u[1]+' • '+(u[3]?'BUSY':'READY')+'</small></button>').join('');document.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;renderUnits()})}
function build(){el('city').innerHTML=districts.map((d,di)=>'<div class="block">'+d.slice(1).map((name,j)=>'<div class="building" data-key="'+di+'-'+j+'">'+name+'</div>').join('')+'</div>').join('');document.querySelectorAll('.building').forEach(b=>b.onclick=()=>dispatch(b));el('vehicles').innerHTML=roster.map((u,i)=>'<div class="vehicle" id="v'+i+'" style="left:'+(3+i*2.5)+'%;top:49%">'+u[2]+'</div>').join('')}
function call(){if(paused||incidents.length>=5)return;const t=types[Math.floor(Math.random()*types.length)],candidates=[...document.querySelectorAll('.building')].filter(b=>t.where.includes(b.textContent)&&!b.classList.contains('incident'));if(!candidates.length)return;const b=candidates[Math.floor(Math.random()*candidates.length)],id=Date.now()+Math.random();incidents.push({id,b,t,assigned:[]});b.classList.add('incident');b.innerHTML+='<span class="marker">!</span>';el('incidentTitle').textContent=t.title;el('incidentDesc').textContent=b.textContent.replace('!','')+' — '+t.need+' response requested';el('count').textContent='ACTIVE INCIDENTS: '+incidents.length;log('911 CALL: '+t.title+' at '+b.textContent.replace('!','')); }
function dispatch(b){const incident=incidents.find(x=>x.b===b);if(!incident||paused)return;const u=roster[selected];if(u[3]){log(u[0]+' is already assigned.');return}u[3]=true;incident.assigned.push(selected);const v=el('v'+selected),map=el('city').getBoundingClientRect(),rect=b.getBoundingClientRect();v.classList.add('moving');v.style.left=(100*(rect.left+rect.width/2-map.left)/map.width)+'%';v.style.top=(100*(rect.top+rect.height/2-map.top)/map.height)+'%';log('DISPATCH: '+u[0]+' responding to '+incident.t.title);renderUnits();setTimeout(()=>{if(!incidents.includes(incident))return;log(u[0]+' on scene.');if(u[1]===incident.t.need){b.classList.remove('incident');b.classList.add('done');b.querySelector('.marker')?.remove();incidents=incidents.filter(x=>x!==incident);resolved++;el('count').textContent='ACTIVE INCIDENTS: '+incidents.length;log('Incident resolved: '+incident.t.title);incident.assigned.forEach(i=>{roster[i][3]=false;el('v'+i).classList.remove('moving')});renderUnits();updateScore()}else{log('Additional '+incident.t.need+' unit required.');u[3]=false;renderUnits()}},3500)}
function updateScore(){el('score').innerHTML='Resolved: '+resolved+'<br>Units available: '+roster.filter(u=>!u[3]).length}
el('call').onclick=call;el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'RESUME':'PAUSE'};setInterval(()=>{if(!paused){minute++;el('clock').textContent='DAY 1 • '+String(Math.floor(minute/60)%24).padStart(2,'0')+':'+String(minute%60).padStart(2,'0')}},1000);build();renderUnits();log('Dispatch center online. All units available.');call();
</script></body></html>
