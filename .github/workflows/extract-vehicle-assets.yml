name: Extract 911 COMMAND Vehicle Assets
on:
  workflow_dispatch:
  push:
    branches: [developer]
    paths:
      - 'www/assets/cars/911_command_vehicle_sprites.zip'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: developer
          persist-credentials: true
      - name: Extract and validate PNG vehicle assets
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, shutil, sys
          archive=pathlib.Path('www/assets/cars/911_command_vehicle_sprites.zip')
          root=pathlib.Path('www/assets/cars')
          assert archive.exists(), 'Vehicle archive missing'
          count=0
          with zipfile.ZipFile(archive) as z:
              entries=[i for i in z.infolist() if not i.is_dir() and i.filename.lower().endswith('.png')]
              if not entries:
                  sys.exit('No PNGs found in vehicle archive')
              for i in entries:
                  parts=pathlib.PurePosixPath(i.filename).parts
                  if any(p in ('..','.') for p in parts) or i.filename.startswith('/'):
                      sys.exit('Unsafe ZIP path: '+i.filename)
                  # Keep the archive's category folders, avoiding duplicated cars/ prefix.
                  while parts and parts[0].lower() in ('www','assets','cars','911_command_vehicle_sprites'):
                      parts=parts[1:]
                  if not parts:
                      continue
                  target=root.joinpath(*parts)
                  if target.suffix.lower()!='.png':
                      continue
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(i) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src,dst)
                  with target.open('rb') as f:
                      if f.read(8)!=bytes([137,80,78,71,13,10,26,10]):
                          sys.exit('Invalid PNG: '+str(target))
                  count+=1
          print(f'Extracted {count} PNG sprites into {root}')
          PY
      - name: Commit extracted vehicles to developer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/assets/cars/
          if ! git diff --cached --quiet; then
            git commit -m "Extract categorized vehicle sprites from ZIP"
            git push origin HEAD:developer
          fi
