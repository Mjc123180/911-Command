name: Build Android Developer APK
on:
  push:
    branches: [developer]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create or restore development-only signing certificate
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" .github/dev-signing
          if [ ! -f .github/dev-signing/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore .github/dev-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=911 COMMAND Development, OU=Development, O=MJC, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/dev-signing/debug.keystore
            git commit -m "Store persistent development-only Android signing certificate [skip ci]"
            git push origin HEAD:developer
          fi
          cp .github/dev-signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "Persistent development APK signing certificate ready."
      - name: Set monotonically increasing debug version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $((10000 + RUN_NUMBER))/" app/build.gradle
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 911-command-dev-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
