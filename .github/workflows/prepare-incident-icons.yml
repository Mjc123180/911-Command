name: Prepare Transparent Incident Icons
on:
  push:
    branches: [developer]
    paths:
      - '.github/workflows/prepare-incident-icons.yml'
      - 'www/assets/icons/911_command_icons_ready.zip'
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: developer
      - name: Install image processing dependency
        run: python -m pip install Pillow
      - name: Extract and safely trim each icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageChops
          import io, json
          root=Path('www/assets/icons')
          out=root/'processed'
          out.mkdir(parents=True,exist_ok=True)
          zip_path=root/'911_command_icons_ready.zip'
          count=0
          with ZipFile(zip_path) as archive:
              for item in archive.infolist():
                  if not item.filename.lower().endswith('.png') or item.is_dir(): continue
                  name=Path(item.filename).name
                  if not name: continue
                  im=Image.open(io.BytesIO(archive.read(item))).convert('RGBA')
                  alpha=im.getchannel('A')
                  # Keep all visible pixels; never slice artwork at fixed grid boundaries.
                  bounds=alpha.getbbox()
                  if not bounds: continue
                  x0,y0,x1,y1=bounds
                  margin=max(8,round(max(x1-x0,y1-y0)*.05))
                  crop=im.crop((x0,y0,x1,y1))
                  result=Image.new('RGBA',(crop.width+2*margin,crop.height+2*margin),(0,0,0,0))
                  result.paste(crop,(margin,margin))
                  result.save(out/name,optimize=True)
                  count+=1
          assert count>=30, f'Expected at least 30 icon PNGs; found {count}'
          for required in ('residential_fire.png','robbery_suspect.png','medical.png','vehicle_collision.png'):
              assert (out/required).is_file(),required
          print(f'Prepared {count} separate icons with transparent padding')
          PY
      - name: Commit processed icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/assets/icons/processed
          if ! git diff --cached --quiet; then
            git commit -m "Prepare uncropped padded transparent emergency icons"
            git push origin developer
          fi
