name: Extract 911 COMMAND Incident Icons
on:
  push:
    branches: [developer]
    paths:
      - 'www/assets/icons/911_command_icons.zip'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: developer
      - name: Extract incident icon sprites
        run: |
          mkdir -p www/assets/icons
          unzip -o www/assets/icons/911_command_icons.zip -d www/assets/icons
          test -f www/assets/icons/manifest.json
          git add www/assets/icons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || (git commit -m "Extract named transparent incident icons" && git push origin developer)
